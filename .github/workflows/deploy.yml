name: Publicar Supermercado Shiro

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar codigo
        run: npm run lint

      - name: Compilar aplicacion
        run: npm run build

      - name: Preparar rutas de React Router
        run: cp dist/index.html dist/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Publicar aplicacion
        id: deployment
        uses: actions/deploy-pages@v5